image:
  repository: quay.io/galaxyproject/galaxy-min
  # Pinned to a fixed snapshot rather than the rolling 26.1-auto tag. The
  # extraFileMappings block at the end of this file mounts a copy of one
  # of Galaxy's own source files over the image's, so the two have to stay
  # in step; a rolling tag would eventually pair a newer image with a
  # stale copy of that file and silently revert whatever changed in it.
  tag: "26.1-auto-0915"

# Raises the gcp_batch job runner's handler-side dispatch/poll concurrency
# from the default of 4. GCP Batch/quota itself isn't the constraint (each
# job gets its own GCE VM); this setting is what actually limits how many
# jobs Galaxy will have in flight to Batch at once, independent of how many
# a test client submits concurrently. Tune to match --parallel-tests on
# the galaxy-tool-test side.
#
# Raised to 60 (from 40) alongside galaxy-tests' --parallel-tests: a
# per-run destination breakdown (docs/parallelism-data, run
# 260908-111959) found 58-61 of a scheduled run's ~198 tools route to
# gcp_batch, so a 32-wide outer test-concurrency cap left every
# local/k8s-routed tool unable to even start until enough batch-routed
# ones (sorted first in .github/scheduled-tool-ids.txt, deliberately -
# see anvil_sort_scheduled_tool_ids.py) drained to free a client slot -
# observed as a ~15 min dead zone for local-runner jobs at the start of
# every run. Sizing this past the batch-routed count means both classes
# can start at minute 0 instead of one gating the other.
#
# The local runner is raised alongside it, because it - not gcp_batch - is
# what actually gates a tool-test run. Every test has to stage its inputs
# before its tool job can be submitted, and the job_conf in values.yml
# routes all of that to `local`: __DATA_FETCH__, upload1, __SET_METADATA__,
# __EXPORT_HISTORY__, __IMPORT_HISTORY__, __EXTRACT_DATASET__, interactive
# tools and .*data_source.*. At the stock 3 workers that's a 3-slot gate in
# front of a 32-slot Batch pool.
configs:
  job_conf.yml:
    runners:
      gcp_batch:
        workers: 60
      local:
        workers: 12
  galaxy.yml:
    galaxy:
      # The stock pool (5+10) is sized for one interactive user, not a CI
      # client driving 60 tool workers x 4 parallel test cases at a single
      # galaxy-web pod. It must be raised - but only in step with Postgres,
      # because the ceiling is per Galaxy *process* and two of them hold
      # pools (galaxy-web and the job handler).
      #
      # Too small and requests queue past pool_timeout:
      #   sqlalchemy.exc.TimeoutError: QueuePool limit ... reached
      # Too large and connections fail on creation instead:
      #   FATAL: remaining connection slots are reserved for roles with
      #          the SUPERUSER attribute
      #
      # Both reach the client the same way - a plain-text 500 that
      # galaxy-tool-test reports as JSONDecodeError, and counts as a tool
      # error rather than an infrastructure failure.
      #
      # 20+60 = 80 per process, 160 for both, against max_connections 200
      # (see postgresql below): ~37 slots spare for CNPG monitoring and
      # admin sessions. Postgres holds shared_buffers plus roughly work_mem
      # per backend, so 200 fits the chart's 2Gi pod limit; 400 would not.
      #
      # Raise both together or neither.
      database_engine_option_pool_size: 20
      database_engine_option_max_overflow: 60

# Local-runner jobs execute *inside* the job handler pod, so they draw on
# that pod's memory allowance rather than the node's directly - which makes
# `limits.memory` the real ceiling on how many can run at once, not vCPU
# count. galaxy-helm ships 7G, sized for a handler that dispatches rather
# than one running a dozen concurrent uploads; raising local.workers 4x
# without raising it risks trading a queueing bottleneck for an OOMKill.
#
# That matters here because an OOMKill in that cgroup is indistinguishable
# from the intermittent __DATA_FETCH__ failures already seen in this
# harness: the job dies with `exit_code: None, stderr: .`, no traceback,
# hitting a different random handful of tools each run. 12G on a
# t2d-standard-16 (64G) is cheap insurance; if that failure mode persists
# after this change, the handler pod's restart count and
# lastState.terminated.reason are the first things to check.
jobHandlers:
  resources:
    limits:
      memory: 12G

# Paired with the DB pool above - the ceiling across galaxy-web and the job
# handler has to fit inside max_connections, less the 3 slots Postgres
# reserves for superusers. CNPG defaults to 100, which two 80-connection
# pools overrun. galaxy-helm has no dedicated key, so this goes through the
# Cluster spec passthrough.
postgresql:
  operator:
    operatorSpecExtra:
      postgresql:
        parameters:
          max_connections: "200"

# Under test: a candidate fix for galaxyproject/galaxy#17773, where the local
# runner's forked child aborts before it execs the job script. The job ends
# with exit_code NULL, no stderr and an empty outputs/, which Galaxy reports
# as "Unable to finish job" - masking the real cause (see galaxyproject/
# galaxy#23408). Historically ~1 in 150 local-runner jobs, clustered while
# many workers fork concurrently early in a run.
#
# The runner passes preexec_fn=os.setpgrp to Popen, which runs Python in the
# child between fork and exec. Python documents that as unsafe in a threaded
# process - after fork the child may only call async-signal-safe functions -
# and this handler forks from worker threads: 84 threads and 235 mapped
# native libraries, measured on the deployment on 2026-09-15.
#
# start_new_session=True asks subprocess for the same thing without running
# Python in the child: it is handed to _posixsubprocess.fork_exec and done in
# C. It calls setsid() rather than setpgrp(), so the child is the leader of a
# new session as well as a new process group - PGID == PID either way, which
# is all check_pg/kill_pg use. The extra session is harmless here: job scripts
# are non-interactive with their output already redirected to files.
#
# Chosen over process_group=0 (which this file carried on 2026-09-15) because
# process_group needs Python 3.11 and Galaxy supports 3.10, so that version
# needed a branch and left 3.10 on the buggy path. start_new_session has been
# available since Python 3.2, so one line covers every supported version - and
# it is what we would propose upstream.
#
# Evidence: run 260916 carried process_group=0 and logged 1,380 local-runner
# forks with zero failures, against ~9.2 expected at the historical rate
# (p=0.0001). start_new_session was then verified on the ea-dev deployment:
# 60/60 jobs ok, correct PGID==PID isolation, and Galaxy's own kill_pg killing
# a 3-process job tree with check_pg flipping correctly. Equivalence is
# established; the per-night failure statistics were gathered on the other
# variant.
#
# PINNED TO ONE IMAGE. This is the copy from galaxy-min:26.1-auto-0915
# (244 lines, md5 001ecf77397717d45bdc38fdf813a46f before the change), which is
# why the tag at the top of this file is fixed. On an image bump: re-extract
# that file, re-apply the single hunk, update both the tag and this note.
#
# To end the experiment, delete this block and unpin the tag above.
extraFileMappings:
  /galaxy/server/lib/galaxy/jobs/runners/local.py:
    useSecret: false
    applyToJob: true
    applyToWeb: false
    applyToSetupJob: false
    applyToWorkflow: false
    applyToNginx: false
    # tpl must stay false: this is Python, and Helm would try to render any
    # {{ }} it contains.
    tpl: false
    content: |
      """
      Job runner plugin for executing jobs on the local system via the command line.
      """

      import datetime
      import logging
      import os
      import subprocess
      import tempfile
      import threading
      from time import sleep
      from typing import (
          TYPE_CHECKING,
      )

      from galaxy import model
      from galaxy.job_execution.output_collect import default_exit_code_file
      from galaxy.util import asbool
      from galaxy.util.commands import new_clean_env
      from . import (
          BaseJobRunner,
          JobState,
      )
      from .util.process_groups import (
          check_pg,
          kill_pg,
      )

      if TYPE_CHECKING:
          from galaxy.app import GalaxyManagerApplication
          from galaxy.jobs import MinimalJobWrapper

      log = logging.getLogger(__name__)

      __all__ = ("LocalJobRunner",)

      DEFAULT_POOL_SLEEP_TIME = 1
      # TODO: Set to false and just get rid of this option. It would simplify this
      # class nicely. -John
      DEFAULT_EMBED_METADATA_IN_JOB = True


      class LocalJobRunner(BaseJobRunner):
          """
          Job runner backed by a finite pool of worker threads. FIFO scheduling
          """

          runner_name = "LocalRunner"

          def __init__(self, app: "GalaxyManagerApplication", nworkers: int, **kwargs) -> None:
              """Start the job runner"""

              self._proc_lock = threading.Lock()
              self._procs: list[subprocess.Popen] = []

              self._environ = new_clean_env()

              super().__init__(app, nworkers, **kwargs)

          def _command_line(self, job_wrapper: "MinimalJobWrapper") -> tuple[str, str]:
              """ """
              command_line = job_wrapper.runner_command_line

              # slots would be cleaner name, but don't want deployers to see examples and think it
              # is going to work with other job runners.
              slots = job_wrapper.job_destination.params.get("local_slots") or os.environ.get("GALAXY_SLOTS")
              if slots:
                  slots_statement = f'GALAXY_SLOTS="{int(slots)}"; export GALAXY_SLOTS; GALAXY_SLOTS_CONFIGURED="1"; export GALAXY_SLOTS_CONFIGURED;'
              else:
                  slots_statement = 'GALAXY_SLOTS="1"; export GALAXY_SLOTS;'

              job_id = job_wrapper.get_id_tag()
              job_file = JobState.default_job_file(job_wrapper.working_directory, job_id)
              exit_code_path = default_exit_code_file(job_wrapper.working_directory, job_id)
              job_script_props = {
                  "slots_statement": slots_statement,
                  "command": command_line,
                  "exit_code_path": exit_code_path,
                  "working_directory": job_wrapper.working_directory,
                  "shell": job_wrapper.shell,
              }
              job_file_contents = self.get_job_file(job_wrapper, **job_script_props)
              self.write_executable_script(job_file, job_file_contents, job_io=job_wrapper.job_io)
              return job_file, exit_code_path

          def queue_job(self, job_wrapper: "MinimalJobWrapper") -> None:
              if not self._prepare_job_local(job_wrapper):
                  return

              stderr = stdout = ""

              # command line has been added to the wrapper by prepare_job()
              job_file, exit_code_path = self._command_line(job_wrapper)
              job_id = job_wrapper.get_id_tag()

              try:
                  stdout_file = tempfile.NamedTemporaryFile(mode="wb+", suffix="_stdout", dir=job_wrapper.working_directory)
                  stderr_file = tempfile.NamedTemporaryFile(mode="wb+", suffix="_stderr", dir=job_wrapper.working_directory)
                  log.debug(f"({job_id}) executing job script: {job_file}")
                  # start_new_session makes the child the root of its own process
                  # group (setsid, so PGID == PID), which is what check_pg/kill_pg
                  # need. It is done in C between fork and exec; the equivalent
                  # preexec_fn=os.setpgrp runs Python there instead, which is unsafe
                  # in a threaded process and is what this replaces.
                  proc = subprocess.Popen(
                      args=[job_file],
                      cwd=job_wrapper.working_directory,
                      stdout=stdout_file,
                      stderr=stderr_file,
                      env=self._environ,
                      start_new_session=True,
                  )

                  # Add custom attribute to track if the job was terminated by a shutdown
                  proc.terminated_by_shutdown = False  # type: ignore[attr-defined]
                  with self._proc_lock:
                      self._procs.append(proc)

                  try:
                      job = job_wrapper.get_job()
                      # Flush job with change_state.
                      job_wrapper.set_external_id(proc.pid, job=job, flush=False)
                      job_wrapper.change_state(model.Job.states.RUNNING, job=job)
                      self._handle_container(job_wrapper, proc)

                      terminated = self.__poll_if_needed(proc, job_wrapper, job_id)
                      proc.wait()  # reap
                      if terminated:
                          return
                      elif check_pg(proc.pid):
                          kill_pg(proc.pid)
                  finally:
                      with self._proc_lock:
                          self._procs.remove(proc)

                  if proc.terminated_by_shutdown:  # type: ignore[attr-defined]
                      self._fail_job_local(job_wrapper, "job terminated by Galaxy shutdown")
                      return

                  stdout_file.seek(0)
                  stderr_file.seek(0)
                  stdout = self._job_io_for_db(stdout_file)
                  stderr = self._job_io_for_db(stderr_file)
                  stdout_file.close()
                  stderr_file.close()
                  log.debug(f"execution finished: {job_file}")
              except Exception:
                  log.exception("failure running job %d", job_wrapper.job_id)
                  self._fail_job_local(job_wrapper, "failure running job")
                  return

              self._handle_metadata_if_needed(job_wrapper)

              job_destination = job_wrapper.job_destination
              job_state = JobState(job_wrapper, job_destination)
              job_state.stop_job = False
              self._finish_or_resubmit_job(job_state, stdout, stderr, job_id=job_id)

          def stop_job(self, job_wrapper):
              # if our local job has JobExternalOutputMetadata associated, then our primary job has to have already finished
              job = job_wrapper.get_job()
              job_ext_output_metadata = job.get_external_output_metadata()
              try:
                  pid = job_ext_output_metadata[
                      0
                  ].job_runner_external_pid  # every JobExternalOutputMetadata has a pid set, we just need to take from one of them
                  assert pid not in [None, ""]
              except Exception:
                  # metadata internal or job not complete yet
                  pid = job.get_job_runner_external_id()
              if pid in [None, ""]:
                  log.warning(f"stop_job(): {job.id}: no PID in database for job, unable to stop")
                  return
              pid = int(pid)
              if not check_pg(pid):
                  log.warning("stop_job(): %s: Process group %d was already dead or can't be signaled", job.id, pid)
                  return
              log.debug("stop_job(): %s: Terminating process group %d", job.id, pid)
              kill_pg(pid)

          def recover(self, job: model.Job, job_wrapper: "MinimalJobWrapper") -> None:
              # local jobs can't be recovered
              job_wrapper.change_state(
                  model.Job.states.ERROR, info="This job was killed when Galaxy was restarted.  Please retry the job."
              )

          def shutdown(self) -> None:
              super().shutdown()
              with self._proc_lock:
                  for proc in self._procs:
                      proc.terminated_by_shutdown = True  # type: ignore[attr-defined]
                      kill_pg(proc.pid)
                      proc.wait()  # reap

          def _fail_job_local(self, job_wrapper, message):
              job_destination = job_wrapper.job_destination
              job_state = JobState(job_wrapper, job_destination)
              job_state.fail_message = message
              job_state.stop_job = False
              self.fail_job(job_state, exception=True)

          def _handle_metadata_if_needed(self, job_wrapper):
              if not self._embed_metadata(job_wrapper):
                  self._handle_metadata_externally(job_wrapper, resolve_requirements=True)

          def _embed_metadata(self, job_wrapper):
              job_destination = job_wrapper.job_destination
              if "celery" in job_wrapper.metadata_strategy:
                  return False
              embed_metadata = asbool(job_destination.params.get("embed_metadata_in_job", DEFAULT_EMBED_METADATA_IN_JOB))
              return embed_metadata

          def _prepare_job_local(self, job_wrapper):
              return self.prepare_job(job_wrapper, include_metadata=self._embed_metadata(job_wrapper))

          def _handle_container(self, job_wrapper, proc):
              if not job_wrapper.tool.produces_entry_points:
                  return

              while check_pg(proc.pid):
                  if job_wrapper.check_for_entry_points(check_already_configured=False):
                      return

                  sleep(0.5)

          def __poll_if_needed(self, proc, job_wrapper, job_id):
              # Only poll if needed (i.e. job limits are set)
              if not job_wrapper.has_limits():
                  return

              job_start = datetime.datetime.now()
              i = 0
              pgid = proc.pid
              # Iterate until the process exits, periodically checking its limits
              while check_pg(pgid):
                  i += 1
                  if (i % 20) == 0:
                      limit_state = job_wrapper.check_limits(runtime=datetime.datetime.now() - job_start)
                      if limit_state is not None:
                          job_wrapper.fail(limit_state[1])
                          log.debug("(%s) Terminating process group %d", job_id, pgid)
                          kill_pg(pgid)
                          return True
                  else:
                      sleep(DEFAULT_POOL_SLEEP_TIME)
