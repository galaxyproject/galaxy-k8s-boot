image:
  repository: quay.io/galaxyproject/galaxy-min
  tag: "26.1-auto"

# Raises the gcp_batch job runner's handler-side dispatch/poll concurrency
# from the default of 4. GCP Batch/quota itself isn't the constraint (each
# job gets its own GCE VM); this setting is what actually limits how many
# jobs Galaxy will have in flight to Batch at once, independent of how many
# a test client submits concurrently. Tune to match --parallel-tests on
# the galaxy-tool-test side.
#
# Raised to 60 (from 40) alongside galaxy-tests' --parallel-tests: a
# per-run destination breakdown (docs/parallelism-data, run
# 260908-111959) found 58-61 of a scheduled run's ~198 tools route to
# gcp_batch, so a 32-wide outer test-concurrency cap left every
# local/k8s-routed tool unable to even start until enough batch-routed
# ones (sorted first in .github/scheduled-tool-ids.txt, deliberately -
# see anvil_sort_scheduled_tool_ids.py) drained to free a client slot -
# observed as a ~15 min dead zone for local-runner jobs at the start of
# every run. Sizing this past the batch-routed count means both classes
# can start at minute 0 instead of one gating the other.
#
# The local runner is raised alongside it, because it - not gcp_batch - is
# what actually gates a tool-test run. Every test has to stage its inputs
# before its tool job can be submitted, and the job_conf in values.yml
# routes all of that to `local`: __DATA_FETCH__, upload1, __SET_METADATA__,
# __EXPORT_HISTORY__, __IMPORT_HISTORY__, __EXTRACT_DATASET__, interactive
# tools and .*data_source.*. At the stock 3 workers that's a 3-slot gate in
# front of a 32-slot Batch pool.
configs:
  job_conf.yml:
    runners:
      gcp_batch:
        workers: 60
      local:
        workers: 12
  galaxy.yml:
    galaxy:
      # The stock pool (5+10) is sized for one interactive user, not a CI
      # client driving 60 tool workers x 4 parallel test cases at a single
      # galaxy-web pod. It must be raised - but only in step with Postgres,
      # because the ceiling is per Galaxy *process* and two of them hold
      # pools (galaxy-web and the job handler).
      #
      # Too small and requests queue past pool_timeout:
      #   sqlalchemy.exc.TimeoutError: QueuePool limit ... reached
      # Too large and connections fail on creation instead:
      #   FATAL: remaining connection slots are reserved for roles with
      #          the SUPERUSER attribute
      #
      # Both reach the client the same way - a plain-text 500 that
      # galaxy-tool-test reports as JSONDecodeError, and counts as a tool
      # error rather than an infrastructure failure.
      #
      # 20+60 = 80 per process, 160 for both, against max_connections 200
      # (see postgresql below): ~37 slots spare for CNPG monitoring and
      # admin sessions. Postgres holds shared_buffers plus roughly work_mem
      # per backend, so 200 fits the chart's 2Gi pod limit; 400 would not.
      #
      # Raise both together or neither.
      database_engine_option_pool_size: 20
      database_engine_option_max_overflow: 60

# Local-runner jobs execute *inside* the job handler pod, so they draw on
# that pod's memory allowance rather than the node's directly - which makes
# `limits.memory` the real ceiling on how many can run at once, not vCPU
# count. galaxy-helm ships 7G, sized for a handler that dispatches rather
# than one running a dozen concurrent uploads; raising local.workers 4x
# without raising it risks trading a queueing bottleneck for an OOMKill.
#
# That matters here because an OOMKill in that cgroup is indistinguishable
# from the intermittent __DATA_FETCH__ failures already seen in this
# harness: the job dies with `exit_code: None, stderr: .`, no traceback,
# hitting a different random handful of tools each run. 12G on a
# t2d-standard-16 (64G) is cheap insurance; if that failure mode persists
# after this change, the handler pod's restart count and
# lastState.terminated.reason are the first things to check.
jobHandlers:
  resources:
    limits:
      memory: 12G

# Paired with the DB pool above - the ceiling across galaxy-web and the job
# handler has to fit inside max_connections, less the 3 slots Postgres
# reserves for superusers. CNPG defaults to 100, which two 80-connection
# pools overrun. galaxy-helm has no dedicated key, so this goes through the
# Cluster spec passthrough.
postgresql:
  operator:
    operatorSpecExtra:
      postgresql:
        parameters:
          max_connections: "200"
