# Profile for AnVIL-style Galaxy deployment with automatic data import
# Uses the simplified ABM bootstrap postInstall hook

# Enable postInstall job with bootstrap configuration
postInstallJob:
  enabled: true
  galaxyUser: "dev@galaxyproject.org"
  bootstrapConfig: |
    datasets:
      "Imported Datasets":
        - "https://zenodo.org/records/1324070/files/Saccharomyces_cerevisiae.R64-1-1.100.gtf.gz"
        - "https://zenodo.org/records/1324070/files/SRR891268_1.fastq.gz"
        - "https://zenodo.org/records/1324070/files/SRR891268_2.fastq.gz"
    workflows:
      - "https://raw.githubusercontent.com/galaxyproject/iwc/refs/heads/main/workflows/transcriptomics/rnaseq-pe/rnaseq-pe.ga"