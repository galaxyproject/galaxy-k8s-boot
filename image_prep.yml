---
# Optimized image preparation playbook - minimal fact gathering for speed
- name: Prepare machine image with pre-installed components for RKE2
  hosts: all
  become: true
  gather_facts: true  # Only gather facts once at the start
  vars:
    # Cache facts to avoid re-gathering
    ansible_facts_gathering: smart
    ansible_facts_cache: true

    # Package installation flags
    install_base_packages: true
    install_cvmfs: true
    install_rke2_prerequisites: true
    install_helm: true
    prefetch_container_images: true

    # CVMFS configuration (galaxyproject.cvmfs role)
    cvmfs_role: client
    galaxy_cvmfs_repos_enabled: config-repo
    cvmfs_quota_limit: 4000
    cvmfs_http_proxies: ["DIRECT"]
    # Repos to test explicitly
    cvmfs_verify_repos:
      - data.galaxyproject.org
      - cloud.galaxyproject.org

  pre_tasks:
    - name: Display target host information
      ansible.builtin.debug:
        msg: |
          Preparing image for host: {{ inventory_hostname }}
          OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          Architecture: {{ ansible_facts['architecture'] }}

    - name: Wait for background apt/dpkg locks to be released and stop unattended-upgrades
      ansible.builtin.shell: |
        # Temporarily stop unattended-upgrades so it does not trigger again
        systemctl stop unattended-upgrades || true
        systemctl disable unattended-upgrades || true
        
        # Wait for any active lock to release
        for i in $(seq 1 120); do
          if ! fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; then
            echo "Apt locks are clear!"
            exit 0
          fi
          echo "Apt/dpkg lock is currently held by another process. Waiting..."
          sleep 5
        done
        echo "Timed out waiting for apt lock!"
        exit 1
      changed_when: false
      failed_when: false # Ignore if fuser is missing, apt will try to run anyway

    - name: Update system packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Install base packages early (needed for CVMFS role keys)
      ansible.builtin.import_tasks: roles/image_preparation/tasks/base_packages.yml
      when: install_base_packages | bool

    - name: Copy requirements.yml to remote host
      ansible.builtin.copy:
        src: requirements.yml
        dest: /tmp/galaxy-k8s-boot-requirements.yml
        mode: '0644'
      when: install_rke2_prerequisites | bool

    - name: Create system-wide Ansible roles directory
      ansible.builtin.file:
        path: /usr/share/ansible/roles
        state: directory
        mode: '0755'
      when: install_rke2_prerequisites | bool

    - name: Install Ansible collections from requirements.yml
      ansible.builtin.command: ansible-galaxy collection install -r /tmp/galaxy-k8s-boot-requirements.yml
      changed_when: true
      when: install_rke2_prerequisites | bool

    - name: Install Ansible roles from requirements.yml to system location
      ansible.builtin.command: ansible-galaxy role install -r /tmp/galaxy-k8s-boot-requirements.yml -p /usr/share/ansible/roles
      changed_when: true
      when: install_rke2_prerequisites | bool

    # galaxyproject.cvmfs 0.5.0 only downloads the CERN GPG key for Ubuntu
    # (jammy/noble). On Debian the repo config still references the same path,
    # so we pre-seed it here. This workaround can be removed once upstream
    # fixes the conditional in init_debian.yml.
    - name: Download CernVM GPG key for Debian
      ansible.builtin.get_url:
        url: https://cvmrepo.web.cern.ch/cvmrepo/apt/cernvm.gpg
        dest: /usr/share/keyrings/cernvm.gpg
        mode: '0644'
      become: true
      when:
        - install_cvmfs | bool
        - ansible_facts['distribution'] == 'Debian'

  roles:
    - role: galaxyproject.cvmfs
      when: install_cvmfs | bool

    - role: image_preparation

  post_tasks:
    # galaxyproject.cvmfs 0.5.0 uses `cvmfs_config_repo | bool` to guard this
    # setup, which ansible-core now treats as false for dict values.
    - name: Ensure Galaxy CVMFS config repository is configured
      when:
        - install_cvmfs | bool
        - galaxy_cvmfs_repos_enabled == 'config-repo'
      block:
        - name: Create Galaxy CVMFS config repo config
          ansible.builtin.copy:
            content: |
              ## This file is maintained by Ansible - CHANGES WILL BE OVERWRITTEN
              CVMFS_SERVER_URL="{{ galaxy_cvmfs_config_repo.urls | join(';') }}"
              CVMFS_PUBLIC_KEY="{{ galaxy_cvmfs_config_repo.key.path }}"
            dest: /etc/cvmfs/config.d/{{ galaxy_cvmfs_config_repo.repository.repository }}.conf
            owner: root
            group: root
            mode: "0444"
          register: galaxy_cvmfs_config_repo_conf

        - name: Set Galaxy CVMFS config repo defaults
          ansible.builtin.copy:
            content: |
              ## This file is maintained by Ansible - CHANGES WILL BE OVERWRITTEN
              CVMFS_CONFIG_REPOSITORY="{{ galaxy_cvmfs_config_repo.repository.repository }}"
              CVMFS_DEFAULT_DOMAIN="{{ galaxy_cvmfs_config_repo.domain }}"
              CVMFS_USE_GEOAPI="{{ galaxy_cvmfs_config_repo.use_geoapi | default(false) | ternary('yes', 'no') }}"
            dest: /etc/cvmfs/default.d/80-ansible-galaxyproject-cvmfs.conf
            owner: root
            group: root
            mode: "0444"
          register: galaxy_cvmfs_config_repo_defaults

        - name: Restart autofs after Galaxy CVMFS config repo changes
          ansible.builtin.service:
            name: autofs
            state: restarted
          when: galaxy_cvmfs_config_repo_conf.changed or galaxy_cvmfs_config_repo_defaults.changed

    - name: Verify CVMFS client installed
      ansible.builtin.command: which cvmfs_config
      register: cvmfs_config_check
      changed_when: false
      failed_when: install_cvmfs and cvmfs_config_check.rc != 0
      when: install_cvmfs | bool

    - name: Probe CVMFS configuration
      ansible.builtin.command: cvmfs_config probe
      register: cvmfs_probe
      changed_when: false
      failed_when: false
      when: install_cvmfs | bool

    - name: Show CVMFS probe output
      ansible.builtin.debug:
        var: cvmfs_probe.stdout
      when: install_cvmfs | bool and cvmfs_probe is defined

    - name: Ensure autofs service running for CVMFS
      ansible.builtin.service:
        name: autofs
        state: started
        enabled: true
      when: install_cvmfs | bool
      failed_when: false

    - name: Wait for CVMFS base directory
      ansible.builtin.stat:
        path: /cvmfs
      register: cvmfs_basedir
      retries: 5
      delay: 2
      until: not install_cvmfs or cvmfs_basedir.stat.exists

    - name: Attempt mount of CVMFS repositories
      when: install_cvmfs | bool
      block:
        - name: Trigger on-demand mount by listing repo root
          ansible.builtin.command: ls -1 /cvmfs/{{ item }}/
          register: cvmfs_repo_list
          changed_when: false
          failed_when: false
          loop: "{{ cvmfs_verify_repos }}"
          loop_control:
            label: "{{ item }}"

        - name: Summarize CVMFS repo mount results
          ansible.builtin.debug:
            msg: |
              CVMFS mount results:
              {% for r in cvmfs_repo_list.results %}
              - {{ r.item }}: {{ 'OK' if r.rc == 0 else 'FAILED rc=' + (r.rc|string) }}
              {% endfor %}

    - name: Fail if any required CVMFS repo failed to mount
      when: install_cvmfs and (cvmfs_repo_list is defined) and (cvmfs_repo_list.results | selectattr('rc','ne',0) | list | length > 0)
      ansible.builtin.fail:
        msg: "CVMFS repository mount failures detected. See previous task output."

    - name: Display installed components summary
      ansible.builtin.debug:
        msg: |
          === Image Preparation Complete ===
          Base packages: {{ 'Installed' if install_base_packages else 'Skipped' }}
          CVMFS client: {{ 'Installed' if install_cvmfs else 'Skipped' }}
          RKE2 prerequisites: {{ 'Installed' if install_rke2_prerequisites else 'Skipped' }}
          Helm: {{ 'Installed with pre-configured repositories' if install_helm else 'Skipped' }}
          Container images: {{ 'Pre-fetched' if prefetch_container_images else 'Skipped' }}

    - name: Verify key components are accessible
      ansible.builtin.command: "{{ item }}"
      register: version_checks
      loop:
        - "helm version --short"
        - "cvmfs_config probe"
        - "crictl version"
      failed_when: false
      changed_when: false

    - name: Display component versions
      ansible.builtin.debug:
        msg: "{{ item.cmd }} -> {{ item.stdout | default(item.stderr) }}"
      loop: "{{ version_checks.results }}"

    - name: Verify Ansible roles are installed in system location
      ansible.builtin.command: ansible-galaxy role list -p /usr/share/ansible/roles
      register: ansible_roles_list
      changed_when: false
      when: install_rke2_prerequisites | bool

    - name: Display installed Ansible roles
      ansible.builtin.debug:
        var: ansible_roles_list.stdout_lines
      when: install_rke2_prerequisites | bool

    - name: Create image preparation completion marker
      ansible.builtin.copy:
        content: |
          Image prepared on: {{ ansible_date_time.iso8601 }}

          Installed components:
          - RKE2 prerequisites: {{ rke2_version }}
          - Helm: {{ helm_version }} with pre-configured repositories (stable, cloudve)
          - CVMFS client with repositories: {{ cvmfs_verify_repos | join(', ') if install_cvmfs else 'NONE' }}
          - Container images: {{ 'Pre-fetched for faster deployment' if prefetch_container_images else 'Not cached' }}
          - Ansible roles and collections: Installed from requirements.yml

          Next steps:
          1. Create image snapshot from this instance
          2. Use prepared image for faster RKE2 cluster deployment
        dest: /etc/galaxy-k8s-boot-image-info
        mode: "0644"

    - name: Final cleanup and preparation for imaging
      block:
        - name: Clear systemd journal (if needed for image size reduction)
          ansible.builtin.command: journalctl --vacuum-time=1s
          failed_when: false
          changed_when: false  # This doesn't change system state meaningfully

        - name: Clear network configuration that might be host-specific
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/netplan/50-cloud-init.yaml
            - /etc/network/interfaces.d/50-cloud-init.cfg
          failed_when: false
