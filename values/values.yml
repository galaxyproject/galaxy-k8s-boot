
terra:
  launch:
    workspace: ""
    namespace: ""
    drsURL: ""
    apiURL: ""

image:
  repository: quay.io/galaxyproject/galaxy-min
  tag: "26.1-auto"

ingress:
  enabled: true
  ingressClassName: ""
  canary:
    enabled: false
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
  - host: ~
    paths:
    - path: /
  path: /

persistence:
  storageClass: nfs

cvmfs:
  deploy: false
  deployPostInstallFix: true
  cvmfscsi:
    cache:
      local:
        enabled: true
        pvc:
          storageClass: nfs
          name: cvmfs-local-cache
      alien:
        enabled: false
        pvc:
          name: cvmfs-alien-cache
    logVerbosityLevel: 5

postgresql:
  persistence:
    storageClass: postgres-storage

rabbitmq:
  persistence:
    storageClassName: blockstorage

configs:
  galaxy.yml:
    galaxy:
      enable_beta_gdpr: true
      tus_upload_store: /galaxy/server/database/tmp/tus_upload_store
      # The URL linked by the "Galaxy/brand" text
      logo_url: https://anvil.terra.bio/#workspaces
      # The brand image source
      logo_src: /static/images/galaxy-project-logo-white-square.png
      # The custom brand image source
      logo_src_secondary: /static/images/anvil-project-logo-white.png
      enable_quotas: true
      single_user: default-user@galaxyproject.org
      admin_users: default-user@galaxyproject.org
  job_conf.yml:
    runners:
      gcp_batch:
        load: galaxy.jobs.runners.gcp_batch:GoogleCloudBatchJobRunner
        workers: 4
        # Basic GCP settings
        project_id: anvil-and-terra-development
        # Overridden by the region derived from the VM's zone, or by an explicit
        # gcp_batch_region, when enable_gcp_batch is set
        region: us-east4
        service_account_email: galaxy-batch-runner@anvil-and-terra-development.iam.gserviceaccount.com

        # Network configuration (required for NFS access)
        network: default
        subnet: default

        # Compute resources (defaults shown)
        machine_type: n2-standard-4
        vcpu: 1.0
        memory_mib: 2048
        boot_disk_size_gb: 100
        boot_disk_type: pd-standard

        # Container settings
        use_container: true
        # Note: container_image comes from tool requirements via Galaxy's container finder
        galaxy_user_id: 10001
        galaxy_group_id: 10001
        docker_extra_volumes: "/cvmfs/data.galaxyproject.org:/cvmfs/data.galaxyproject.org:ro,/cvmfs/cloud.galaxyproject.org:/cvmfs/cloud.galaxyproject.org:ro"

        # Custom VM image with CVMFS pre-configured (update date as needed)
        custom_vm_image: projects/anvil-and-terra-development/global/images/galaxy-k8s-boot-v2026-06-30
        # Job execution settings
        max_retry_count: 3
        # Max time a job will run before being deleted. Must be in seconds (end with 's'). Default 24hrs.
        max_run_duration: 86400s
        polling_interval: 30
        # delete_completed_jobs: true # Not available until 26.1 (is in v26.1-auto images)
      local:
        load: galaxy.jobs.runners.local:LocalJobRunner
        workers: 3
    execution:
      default: tpv_dispatcher
      environments:
        local:
          runner: local
        gcp_batch:
          runner: gcp_batch
    destinations:
      - id: gcp_batch_default
        runner: gcp_batch
      - id: k8s_default
        runner: k8s
      - id: local_default
        runner: local
    tools:
      - environment: local
        id: upload1
      - environment: local
        id: __DATA_FETCH__
      - environment: local
        id: __EXPORT_HISTORY__
      - environment: local
        id: __IMPORT_HISTORY__
      - environment: local
        id: __SET_METADATA__
      - environment: local
        id: __EXTRACT_DATASET__
      # Route interactive tools to Kubernetes
      - environment: local
        id: interactive_tool.*
      # Route data source tools to Kubernetes
      - environment: local
        id: .*data_source.*
      # Keep workflows internal to cluster
      - environment: local
        id: __EXPORT_WORKFLOW__
      - environment: local
        id: __IMPORT_WORKFLOW__
      - environment: local
        id: random_lines1
      # Expression/param tools must run locally — TPV additive tag merge
      # with the global DB causes reject:[local] to persist even when
      # overridden, so route them here before TPV is consulted.
      - environment: local
        id: compose_text_param
      - environment: local
        id: map_param_value
      - environment: local
        id: param_value_from_file
      - environment: local
        id: tp_awk_tool
      - environment: local
        id: tp_grep_tool
    limits:
      - type: total_walltime
        window: 1  # number in days
        value: '96:00:00'  # total walltime in HH:MM:SS that all jobs cannot exceed or add'l jobs won't run
  file_sources_conf.yml:
    - doc: "{{ .Values.terra.launch.workspace }}"
      id: terra-launch-workspace
      workspace: "{{ .Values.terra.launch.workspace }}"
      namespace: "{{ .Values.terra.launch.namespace }}"
      type: anvil
      on_anvil: True
      writable: True
      api_url: "{{ .Values.terra.launch.apiURL }}"
      drs_url: "{{ .Values.terra.launch.drsURL }}"

    - type: ftp
      id: ebi-ftp
      label: "EBI FTP server"
      doc: "European Bioinformatic Institute FTP server"
      host: "ftp.ebi.ac.uk"
      user: "anonymous"
      passwd: ""
      timeout: 10
      port: 21

    - type: ftp
      id: covid-monitoring
      label: "SARS-CoV-2 result files"
      doc: "SARS-CoV-2 variants and consensus sequences"
      host: "xfer13.crg.eu"
      user: "anonymous"
      passwd: ""
      timeout: 10
      port: 21

    - type: ftp
      id: ncbi-ftp
      label: "NCBI FTP server"
      doc: "NCBI FTP server"
      host: "ftp.ncbi.nlm.nih.gov"
      user: "anonymous"
      passwd: ""
      timeout: 10
      port: 21

    - type: ftp
      id: ensembl-ftp
      label: "ENSEMBL FTP server"
      doc: "ENSEMBL FTP server"
      host: "ftp.ensemblgenomes.org/vol1/pub/"
      user: "anonymous"
      passwd: ""
      timeout: 10
      port: 21

    - type: s3fs
      label: Genome Ark
      id: genomeark
      doc: Access to Genome Ark open data on AWS.
      bucket: genomeark
      anon: true

    - type: s3fs
      label: 1000 Genomes
      id: 1000genomes
      doc: Access to the 1000 Genomes Project with human genetic variation, including SNPs, structural variants, and their haplotype context.
      bucket: 1000genomes
      anon: true

    - type: s3fs
      label: The Cancer Genome Atlas
      id: tcga-2-open
      doc: Access to the Cancer Genome Atlas (TCGA)
      bucket: tcga-2-open
      anon: true

    - type: s3fs
      label: COVID-19 Data Lake
      id: covid19-lake
      doc: A centralized repository of up-to-date and curated datasets on or related to the spread and characteristics of the novel corona virus (SARS-CoV-2) and its associated illness, COVID-19
      bucket: covid19-lake
      anon: true

    - type: s3fs
      label: Encyclopedia of DNA Elements (ENCODE)
      id: encode-public
      doc: The Encyclopedia of DNA Elements (ENCODE) Consortium is an international collaboration of research groups funded by the National Human Genome Research Institute (NHGRI)
      bucket: encode-public
      anon: true

    - type: s3fs
      label: Coupled Model Intercomparison Project 6
      id: esgf-world
      doc: The sixth phase of global coupled ocean-atmosphere general circulation model ensemble
      bucket: esgf-world
      anon: true

    - type: s3fs
      label: CMIP6 GCMs downscaled using WRF
      id: wrf-cmip6-noversioning
      doc: High-resolution historical and future climate simulations from 1980-2100
      bucket: wrf-cmip6-noversioning
      anon: true

    - type: s3fs
      label: GBIF European region public datasets
      id: gbif-open-data-eu-central-1
      doc: The Global Biodiversity Information Facility is an international network and data infrastructure aimed at providing anyone, anywhere, open access to data about all types of life on Earth.
      bucket: gbif-open-data-eu-central-1
      anon: true

jobs:
   rules:
    tpv_rules_local.yml:
      destinations:
        k8s:
          max_accepted_cores: 1
          max_accepted_mem: 4
          scheduling:
            prefer:
              - small-job
        gcp_batch:
          runner: gcp_batch
          params:
            docker_enabled: "true"
            cores: "{cores}"
            mem: "{mem}"
            job_id_prefix: galaxy-batch
      tools:
        default:
          scheduling:
            prefer:
              - small-job
          rules:
            - id: force_default_container_for_built_in_tools
              if: |
                from galaxy.tools import GALAXY_LIB_TOOLS_UNVERSIONED
                tool.id in GALAXY_LIB_TOOLS_UNVERSIONED or "CONVERTER_" == tool.id[:10] or tool.is_datatype_converter
              params:
                docker_container_id_override: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

extraVolumes:
  - name: static-images
    configMap:
      name: galaxy-static-images

extraVolumeMounts:
  - name: static-images
    mountPath: /galaxy/server/static/images
    readOnly: true

extraFileMappings:
  /galaxy/server/static/welcome.html:
    applyToWeb: true
    applyToNginx: true
    content: |
      <!DOCTYPE html>
      <html lang="en">
          <head>
              <meta charset="utf-8" />
              <link rel="stylesheet" href="dist/base.css" type="text/css" />
          </head>
          <body class="m-0">
              <div class="py-4">
                  <div class="container">
                      <div class="row mb-4">
                          <div class="col-md-12">
                              <h2>Welcome to Galaxy</h2>
                              <p>
                                  Galaxy is an interactive and workflow analysis
                                  platform providing a graphical user interface
                                  for computational tools. This is your own
                                  Galaxy instance that you can customize and use
                                  for your own research.
                              </p>
                          </div>
                      </div>
                  </div>
              </div>
          </body>
      </html>

webHandlers:
  resources:
    requests:
      cpu: 0.2
  gunicorn:
    timeout: 900             # 15 minutes!
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 120    # 120 * 10 = 20 minutes!

workflowHandlers:
  resources:
    requests:
      cpu: 0.1
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 120

jobHandlers:
  resources:
    requests:
      cpu: 0.4
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 120

nginx:
  resources:
    requests:
      cpu: 0.05

celery:
  resources:
    requests:
      cpu: 0.05
