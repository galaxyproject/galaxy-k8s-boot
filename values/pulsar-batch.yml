
# Pulsar GCP Batch runner configuration
# Uses PulsarGcpBatchJobRunner (coexecution model: Galaxy -> AMQP -> Pulsar sidecar on GCP Batch VM)
#
# IMPORTANT: amqp_url and galaxy_url are set dynamically by the playbook after deployment.
# The playbook detects the node IP, RabbitMQ credentials, and patches the ConfigMap.
# Set enable_pulsar_gcp_batch=true in your inventory or extra vars.

# Increase startup probe timeout to allow for CVMFS tool loading
web:
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 120  # Allow up to ~20 minutes

configs:
  job_conf.yml:
    runners:
      pulsar_gcp:
        load: galaxy.jobs.runners.pulsar:PulsarGcpBatchJobRunner
        # Placeholder amqp_url ensures the runner creates a MessageJobClientManager
        # instead of a PollingJobClientManager (which lacks ensure_has_status_update_callback
        # and crashes the job handler). The real amqp_url and galaxy_url are injected by
        # the playbook via ConfigMap patching after RabbitMQ is running.
        amqp_url: "amqp://placeholder:placeholder@localhost:5672//"
        galaxy_url: "http://localhost/"
    execution:
      default: tpv_dispatcher
      environments:
        local:
          runner: local
        pulsar_gcp:
          runner: pulsar_gcp
          project_id: anvil-and-terra-development
          region: us-east4
          service_account_email: galaxy-batch-runner@anvil-and-terra-development.iam.gserviceaccount.com
          machine_type: n2-standard-4
          docker_extra_volumes: "/cvmfs/data.galaxyproject.org:/cvmfs/data.galaxyproject.org:ro,/cvmfs/cloud.galaxyproject.org:/cvmfs/cloud.galaxyproject.org:ro"
          custom_vm_image: projects/anvil-and-terra-development/global/images/galaxy-k8s-boot-v2026-01-24
    tools:
      - environment: local
        id: upload1
      - environment: local
        id: __DATA_FETCH__
      - environment: local
        id: __EXPORT_HISTORY__
      - environment: local
        id: __IMPORT_HISTORY__
      - environment: local
        id: __SET_METADATA__
      - environment: local
        id: __EXTRACT_DATASET__
      # Route interactive tools locally
      - environment: local
        id: interactive_tool.*
      # Route data source tools locally
      - environment: local
        id: .*data_source.*
      # Keep workflows internal to cluster
      - environment: local
        id: __EXPORT_WORKFLOW__
      - environment: local
        id: __IMPORT_WORKFLOW__

jobs:
  rules:
    tpv_rules_local.yml:
      destinations:
        pulsar_gcp:
          runner: pulsar_gcp
          params:
            docker_enabled: "true"
            cores: "{cores}"
            mem: "{mem}"
