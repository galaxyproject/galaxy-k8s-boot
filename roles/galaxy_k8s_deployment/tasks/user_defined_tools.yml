---
# Roles are database records, so enabling beta tool formats in Helm values is
# insufficient. Keep this outside the post-install import hook: it must run on
# upgrades and restores too, even when imports or user quota setup are disabled.
#
# The grant is auxiliary, so a failure is reported without failing the boot.
- name: Grant Galaxy's single user UDT execution permission
  block:
    # galaxy_user can differ from Galaxy's single_user (Leonardo passes the
    # workspace owner), and only single_user exists in Galaxy's database.
    - name: Read Galaxy's configuration for its single user
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: galaxy-configs
        namespace: galaxy
        kubeconfig: "{{ kubeconfig_path }}"
      register: _udt_galaxy_configs

    - name: Grant the UDT execution role
      ansible.builtin.include_tasks: user_defined_tools_grant.yml
      vars:
        galaxy_single_user: >-
          {{ ((_udt_galaxy_configs.resources[0].data['galaxy.yml'] | from_yaml).galaxy
              | default({})).single_user | default('', true) }}

  rescue:
    - name: Report that UDT execution permission could not be granted
      ansible.builtin.debug:
        msg: >-
          WARNING: Galaxy's single user was not granted UDT execution permission
          ({{ ansible_failed_task.name }}:
          {{ ansible_failed_result.msg | default('see the task output above') }}).
          Grant the Custom Tool Execution role in Galaxy's admin interface, or set
          galaxy_grant_user_defined_tool_permissions=false to skip this step.
