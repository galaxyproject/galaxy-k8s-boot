---
# Helm Repository Setup Tasks
# These tasks require a running Kubernetes cluster and valid kubeconfig

- name: Remove existing stable Helm repo
  kubernetes.core.helm_repository:
    name: stable
    state: absent
    kubeconfig: "{{ kubeconfig_path }}"

- name: Install Helm repositories
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    state: present
    repo_url: "{{ item.url }}"
    force_update: true
    kubeconfig: "{{ kubeconfig_path }}"
  loop: "{{ helm_repositories }}"
