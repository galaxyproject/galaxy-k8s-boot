---
# System Setup Tasks for bare-bones VMs
- name: Install system packages
  ansible.builtin.apt:
    name: "{{ system_packages }}"
    state: present
    update_cache: true
  become: true

- name: Install RKE2 prerequisite packages
  ansible.builtin.apt:
    name:
      - curl
      - iptables
      - apparmor-utils
    state: present
  become: true

- name: Create RKE2 directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/rancher/rke2
    - /var/lib/rancher/rke2
    - /usr/local/bin
  become: true

- name: Check RKE2 version
  ansible.builtin.command: rke2 --version
  register: rke2_installed_version
  failed_when: false
  changed_when: false

- name: Download RKE2 installation script
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /tmp/install-rke2.sh
    mode: '0755'
    timeout: 30
  when: rke2_installed_version.rc != 0 or rke2_version not in rke2_installed_version.stdout
  become: true

- name: Install/Upgrade RKE2 binaries
  ansible.builtin.shell: |
    INSTALL_RKE2_VERSION="{{ rke2_version }}" \
    INSTALL_RKE2_TYPE=server \
    /tmp/install-rke2.sh
  when: rke2_installed_version.rc != 0 or rke2_version not in rke2_installed_version.stdout
  become: true

- name: Create kubectl symlink
  ansible.builtin.file:
    src: /var/lib/rancher/rke2/bin/kubectl
    dest: /usr/local/bin/kubectl
    state: link
    force: true
  become: true

- name: Clean up installation script
  ansible.builtin.file:
    path: /tmp/install-rke2.sh
    state: absent
  become: true

- name: Check Helm version
  ansible.builtin.command: helm version --template '{{ '{{' }} .Version {{ '}}' }}'
  register: helm_installed_version
  failed_when: false
  changed_when: false

- name: Download Helm installation script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-{{ helm_version | regex_replace('^v?([0-9]+).*', '\\1') }}"
    dest: /tmp/get_helm.sh
    mode: "0755"
  when: helm_installed_version.rc != 0 or helm_version not in helm_installed_version.stdout
  become: true

- name: Install/Upgrade Helm
  ansible.builtin.shell:
    cmd: /tmp/get_helm.sh --version {{ helm_version }}
  when: helm_installed_version.rc != 0 or helm_version not in helm_installed_version.stdout
  become: true
  environment:
    DESIRED_VERSION: "{{ helm_version }}"

- name: Clean up Helm installation script
  ansible.builtin.file:
    path: /tmp/get_helm.sh
    state: absent
  become: true
