---
# Galaxy Application Setup Tasks
- name: Ensure Helm repositories are available
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    state: present
    repo_url: "{{ item.url }}"
    force_update: true
  loop: "{{ helm_repositories }}"

- name: Create the galaxy-deps namespace
  kubernetes.core.k8s:
    kind: Namespace
    name: galaxy-deps
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

- name: Create the galaxy namespace
  kubernetes.core.k8s:
    kind: Namespace
    name: galaxy
    state: present
    kubeconfig: "{{ kubeconfig_path }}"

# ============================================================================
# CNPG Skip-Initdb Plugin (for PostgreSQL data reuse)
# ============================================================================
# IMPORTANT: Plugin must be deployed to same namespace as CNPG operator (galaxy-deps)
# See docs/CNPG_SKIP_INITDB_INTEGRATION.md for details
- name: Deploy CNPG skip-initdb plugin for PostgreSQL data reuse
  kubernetes.core.k8s:
    template:
      path: cnpg_skip_initdb_plugin.yaml.j2
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
  when: cnpg_skip_initdb_enabled | default(false) | bool

- name: Wait for skip-initdb plugin deployment to be available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: skip-initdb
    namespace: "{{ cnpg_skip_initdb_namespace | default('galaxy-deps') }}"
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  when: cnpg_skip_initdb_enabled | default(false) | bool

- name: Helm install galaxy-deps
  kubernetes.core.helm:
    name: galaxy-deps
    namespace: galaxy-deps
    chart_ref: "cloudve/galaxy-deps"
    chart_version: "{{ galaxy_deps_version }}"
    kubeconfig: "{{ kubeconfig_path }}"

# ============================================================================
# Galaxy Data Restoration - Determine PVC UUID
# ============================================================================
# Restoration mode already parsed above. Now determine specific PVC UUID.

- name: Auto-detect Galaxy PVC UUID from NFS exports
  shell: |
    # Note: glob must be expanded inside container, so we use sh -c
    for dir in $(kubectl exec -n {{ nfs_provisioner_namespace }} {{ nfs_provisioner_pod_name }} -- \
      sh -c 'ls -d /export/pvc-* 2>/dev/null'); do
      # Check if this looks like a Galaxy data directory (has objects/ subdirectory)
      if kubectl exec -n {{ nfs_provisioner_namespace }} {{ nfs_provisioner_pod_name }} -- \
        test -d "$dir/objects" 2>/dev/null; then
        # Extract UUID from path: /export/pvc-<uuid>
        basename "$dir" | sed 's/^pvc-//'
        exit 0
      fi
    done
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: auto_detected_uuid
  ignore_errors: true
  when: restore_galaxy

- name: Set auto-detected PVC UUID
  set_fact:
    detected_galaxy_pvc_uuid: "{{ auto_detected_uuid.stdout | trim }}"
  when:
    - restore_galaxy
    - auto_detected_uuid.stdout is defined
    - auto_detected_uuid.stdout | trim != ''

- name: Display determined PVC UUID
  debug:
    msg: "Using Galaxy PVC UUID: {{ detected_galaxy_pvc_uuid }}"
  when:
    - restore_galaxy
    - detected_galaxy_pvc_uuid is defined
    - detected_galaxy_pvc_uuid != ''

- name: Warn if auto-detection failed
  debug:
    msg: "WARNING: restore_galaxy=true but no existing PVC found in NFS exports. Falling back to fresh installation."
  when:
    - restore_galaxy
    - detected_galaxy_pvc_uuid is not defined or detected_galaxy_pvc_uuid == ''

# Step 2: Restore Galaxy PVC if UUID determined
- name: Restore Galaxy PVC from existing data
  block:
    - name: Set restore_galaxy_pvc_uuid for include
      set_fact:
        restore_galaxy_pvc_uuid: "{{ detected_galaxy_pvc_uuid }}"

    - name: Include Galaxy PVC restoration tasks
      ansible.builtin.include_tasks: restore_galaxy_pvc.yml

    - name: Set Galaxy Helm values for restore mode
      set_fact:
        galaxy_helm_extra_sets:
          - value: "galaxy.persistence.existingClaim=galaxy-galaxy-pvc"
            value_type: string
          - value: "galaxy.persistence.storageClass="
            value_type: string

  rescue:
    - name: Log restoration failure
      debug:
        msg: |
          WARNING: Galaxy PVC restoration failed. Falling back to fresh deployment.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}

    - name: Clear restore variables to trigger fresh deployment
      set_fact:
        detected_galaxy_pvc_uuid: ""
        galaxy_helm_extra_sets: []

  when:
    - restore_galaxy
    - detected_galaxy_pvc_uuid is defined
    - detected_galaxy_pvc_uuid != ''

- name: Set Galaxy Helm values for fresh deployment
  set_fact:
    galaxy_helm_extra_sets: []
  when: not restore_galaxy or detected_galaxy_pvc_uuid | default('') == ''

# ============================================================================
# Galaxy PVC Detection and Restoration
# ============================================================================
# Priority order:
# 1. If restore_galaxy_pvc_uuid is explicitly provided, use it
# 2. Else if enable_persistent_data_reuse, auto-detect from NFS exports
# 3. If found, create static PV/PVC and set existingClaim

# Step 1: Use explicit UUID if provided
- name: Set restore UUID from explicit parameter
  set_fact:
    detected_galaxy_pvc_uuid: "{{ restore_galaxy_pvc_uuid }}"
  when: restore_galaxy_pvc_uuid | default('') != ''

# Step 2: Auto-detect if no explicit UUID but persistent data reuse is enabled
- name: Check for existing Galaxy NFS exports
  shell: |
    # Note: glob must be expanded inside container, so we use sh -c
    for dir in $(kubectl exec -n {{ nfs_provisioner_namespace }} {{ nfs_provisioner_pod_name }} -- \
      sh -c 'ls -d /export/pvc-* 2>/dev/null'); do
      # Check if this looks like a Galaxy data directory (has objects/ subdirectory)
      if kubectl exec -n {{ nfs_provisioner_namespace }} {{ nfs_provisioner_pod_name }} -- \
        test -d "$dir/objects" 2>/dev/null; then
        # Extract UUID from path: /export/pvc-<uuid>
        basename "$dir" | sed 's/^pvc-//'
        exit 0
      fi
    done
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: auto_detected_uuid
  ignore_errors: true
  when:
    - restore_galaxy_pvc_uuid | default('') == ''
    - enable_persistent_data_reuse | default(true) | bool

- name: Set restore UUID from auto-detection
  set_fact:
    detected_galaxy_pvc_uuid: "{{ auto_detected_uuid.stdout | trim }}"
  when:
    - restore_galaxy_pvc_uuid | default('') == ''
    - enable_persistent_data_reuse | default(true) | bool
    - auto_detected_uuid.stdout is defined
    - auto_detected_uuid.stdout | trim != ''

- name: Display detected Galaxy PVC UUID
  debug:
    msg: "Detected existing Galaxy PVC UUID: {{ detected_galaxy_pvc_uuid }}"
  when: detected_galaxy_pvc_uuid is defined and detected_galaxy_pvc_uuid != ''

# Step 3: Perform restoration if UUID found (explicit or auto-detected)
- name: Attempt Galaxy PVC restoration
  block:
    - name: Set restore_galaxy_pvc_uuid for include
      set_fact:
        restore_galaxy_pvc_uuid: "{{ detected_galaxy_pvc_uuid }}"

    - name: Include Galaxy PVC restoration tasks
      ansible.builtin.include_tasks: restore_galaxy_pvc.yml

    - name: Set Galaxy Helm values for restore mode
      set_fact:
        galaxy_helm_extra_sets:
          - value: "galaxy.persistence.existingClaim=galaxy-galaxy-pvc"
            value_type: string
          - value: "galaxy.persistence.storageClass="
            value_type: string

  rescue:
    - name: Log restoration failure
      debug:
        msg: |
          WARNING: Galaxy PVC restoration failed. Falling back to fresh deployment.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}

    - name: Clear restore variables to trigger fresh deployment
      set_fact:
        detected_galaxy_pvc_uuid: ""
        galaxy_helm_extra_sets: []

  when: detected_galaxy_pvc_uuid | default('') != ''

- name: Set Galaxy Helm values for fresh deployment
  set_fact:
    galaxy_helm_extra_sets: []
  when: detected_galaxy_pvc_uuid | default('') == ''

# ============================================================================
# GCP Batch: NFS Server Configuration
# ============================================================================
# RKE2 without a cloud controller doesn't provision LoadBalancer external IPs.
# Instead, we patch the NFS service to use the node's internal IP as an externalIP,
# which is accessible from GCP Batch VMs in the same VPC.

- name: Get node internal IP for NFS access
  set_fact:
    nfs_server: "{{ ansible_default_ipv4.address }}"

- name: Verify NFS service exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: nfs-provisioner-nfs-server-provisioner
    namespace: nfs-provisioner
    kubeconfig: "{{ kubeconfig_path }}"
  register: nfs_service_info

- name: Fail if NFS service not found
  fail:
    msg: "NFS service not found. Make sure NFS setup completed successfully."
  when: nfs_service_info.resources | length == 0

- name: Patch NFS service with node internal IP as externalIP
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: Service
    name: nfs-provisioner-nfs-server-provisioner
    namespace: nfs-provisioner
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      spec:
        externalIPs:
          - "{{ nfs_server }}"

- name: Display NFS server access method
  debug:
    msg: "Using node internal IP for NFS: {{ nfs_server }} (accessible from GCP Batch VMs in same VPC)"

# ============================================================================
# Install Galaxy
# ============================================================================

- name: Create ConfigMap for Galaxy static images
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: galaxy-static-images
        namespace: galaxy
      binaryData:
        galaxy-project-logo-white-square.png: "{{ lookup('file', 'files/galaxy-project-logo-white-square.png') | b64encode }}"
        anvil-project-logo-white.png: "{{ lookup('file', 'files/anvil-project-logo-white.png') | b64encode }}"

- name: Prepare Galaxy values files list
  set_fact:
    _galaxy_values_files: >-
      {%- if galaxy_values_files is defined and galaxy_values_files | length > 0 -%}
        {{ galaxy_values_files }}
      {%- else -%}
        {{ ['values/values.yml'] }}
      {%- endif -%}

- name: Display Galaxy values files being used
  debug:
    msg: "Using Galaxy Helm values files: {{ _galaxy_values_files }}"

- name: Copy Galaxy values files to the remote host
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp/galaxy_values_{{ idx }}.yml"
    mode: '0644'
  loop: "{{ _galaxy_values_files }}"
  loop_control:
    index_var: idx

- name: Helm install Galaxy
  kubernetes.core.helm:
    name: galaxy
    namespace: galaxy
    chart_ref: "{{ galaxy_chart }}"
    chart_version: "{{ galaxy_chart_version }}"
    kubeconfig: "{{ kubeconfig_path }}"
    update_repo_cache: true
    wait: true
    wait_timeout: "600s"
    values_files: "{{ lookup('sequence', 'start=0 end=' ~ (_galaxy_values_files|length - 1) ~ ' format=/tmp/galaxy_values_%d.yml', wantlist=True) }}"
    values: "{{ _helm_values | combine(_helm_values_skip_initdb if (reuse_existing_data | default(false) | bool) else {}, recursive=True) }}"
    set_values: "{{ galaxy_helm_extra_sets | default([]) }}"
  vars:
    _helm_values:
      persistence:
        size: "{{ galaxy_persistence_size }}"
      postgresql:
        galaxyDatabasePassword: "{{ galaxy_db_password }}"
        cluster:
          plugins:
            - name: "{{ cnpg_skip_initdb_plugin_name | default('cnpg-i-skip-initdb.leonardoce.github.com') }}"
      configs:
        galaxy.yml:
          galaxy:
            master_api_key: "{{ galaxy_api_key | default(omit) }}"
        # Note: gcp_batch runner config is set after PVC detection via ConfigMap update
      jobs:
        rules:
          tpv_rules_local.yml:
            destinations:
              k8s:
                max_cores: "{{ galaxy_job_max_cores }}"
                max_mem: "{{ galaxy_job_max_mem }}"
    _helm_values_skip_initdb:
      postgresql:
        cluster:
          annotations:
            cnpg.io/skip-initdb: "true"

# ============================================================================
# GCP Batch: NFS Export Path Detection
# ============================================================================
- name: Wait for Galaxy PVC to be bound
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    name: galaxy-galaxy-pvc
    namespace: galaxy
    kubeconfig: "{{ kubeconfig_path }}"
  register: galaxy_pvc
  until: galaxy_pvc.resources | length > 0 and galaxy_pvc.resources[0].status.phase == "Bound"
  retries: 30
  delay: 10

- name: Detect NFS export path for Galaxy PVC
  shell: |
    # Wait a moment for NFS export to be available
    sleep 10

    # Get NFS exports and find the PVC export path
    showmount -e {{ nfs_server }} | grep '/export/pvc-' | head -1 | awk '{print $1}'
  register: nfs_export_detection
  retries: 10
  delay: 3
  until: nfs_export_detection.stdout != ""

- name: Set NFS export path for Galaxy database
  set_fact:
    nfs_export_path: "{{ nfs_export_detection.stdout }}"
  when:
    - nfs_export_detection.stdout is defined
    - nfs_export_detection.stdout != ""

- name: Display detected NFS export path
  debug:
    msg: "Detected NFS export path for Galaxy PVC: {{ nfs_export_path }}"
  when: nfs_export_path is defined

- name: Fail if NFS export path not detected
  fail:
    msg: "Could not detect NFS export path for Galaxy PVC. Available exports: {{ nfs_export_detection.stdout_lines | default('none') }}"
  when: nfs_export_path is not defined or nfs_export_path == ""

# ============================================================================
# GCP Batch: Update Configuration and Restart
# ============================================================================
- name: Get current job_conf.yml from ConfigMap
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: galaxy-configs
    namespace: galaxy
    kubeconfig: "{{ kubeconfig_path }}"
  register: galaxy_configs

- name: Update job_conf.yml with gcp_batch_volumes for NFS access
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: galaxy-configs
        namespace: galaxy
      # gcp_batch_volumes format: "server:/remote_path:/mount_path"
      data: "{{ galaxy_configs.resources[0].data | combine({'job_conf.yml': (galaxy_configs.resources[0].data['job_conf.yml'] | from_yaml | combine({'runners': {'gcp_batch': {'gcp_batch_volumes': nfs_server ~ ':' ~ nfs_export_path ~ ':/galaxy/server/database'}}}, recursive=True) | to_nice_yaml) }) }}"
  when:
    - nfs_export_path is defined
    - not (enable_pulsar_gcp_batch | default(false) | bool)

- name: Restart Galaxy deployments to pick up configuration changes
  shell: kubectl rollout restart deployment {{ item }} -n galaxy
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  loop:
    - galaxy-web
    - galaxy-workflow
    - galaxy-job-0
  when:
    - nfs_export_path is defined
    - not (enable_pulsar_gcp_batch | default(false) | bool)

# ============================================================================
# Pulsar GCP Batch: RabbitMQ and Galaxy URL Configuration
# ============================================================================
# The PulsarGcpBatchJobRunner needs:
#   - amqp_url: RabbitMQ accessible from both Galaxy pods and GCP Batch VMs
#   - galaxy_url: Galaxy accessible from GCP Batch VMs for file staging
# We expose RabbitMQ via NodePort and patch the ConfigMap after deployment.

- name: Create NodePort service for RabbitMQ (Pulsar GCP Batch access)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: galaxy-rabbitmq-nodeport
        namespace: galaxy
      spec:
        type: NodePort
        ports:
          - port: 5672
            targetPort: 5672
            nodePort: {{ pulsar_gcp_rabbitmq_nodeport | default(30672) | int }}
            protocol: TCP
        selector:
          app.kubernetes.io/component: rabbitmq
          app.kubernetes.io/name: galaxy-rabbitmq-server
  when: enable_pulsar_gcp_batch | default(false) | bool

- name: Get RabbitMQ credentials from secret (Pulsar GCP)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: galaxy-rabbitmq-server-default-user
    namespace: galaxy
    kubeconfig: "{{ kubeconfig_path }}"
  register: pulsar_rabbitmq_secret
  when: enable_pulsar_gcp_batch | default(false) | bool

- name: Decode RabbitMQ credentials for AMQP URL
  set_fact:
    pulsar_rabbitmq_user: "{{ pulsar_rabbitmq_secret.resources[0].data.username | b64decode }}"
    pulsar_rabbitmq_pass: "{{ pulsar_rabbitmq_secret.resources[0].data.password | b64decode }}"
  when:
    - enable_pulsar_gcp_batch | default(false) | bool
    - pulsar_rabbitmq_secret.resources | length > 0

- name: Construct AMQP URL for Pulsar GCP runner
  set_fact:
    pulsar_amqp_url: "amqp://{{ pulsar_rabbitmq_user }}:{{ pulsar_rabbitmq_pass }}@{{ nfs_server }}:{{ pulsar_gcp_rabbitmq_nodeport | default(30672) }}//"
    pulsar_galaxy_url: "http://{{ nfs_server }}/"
  when:
    - enable_pulsar_gcp_batch | default(false) | bool
    - pulsar_rabbitmq_user is defined

- name: Display Pulsar GCP configuration
  debug:
    msg: |
      Pulsar GCP Batch configuration:
        amqp_url: amqp://{{ pulsar_rabbitmq_user }}:***@{{ nfs_server }}:{{ pulsar_gcp_rabbitmq_nodeport | default(30672) }}//
        galaxy_url: {{ pulsar_galaxy_url }}
  when:
    - enable_pulsar_gcp_batch | default(false) | bool
    - pulsar_amqp_url is defined

- name: Get current job_conf.yml from ConfigMap (Pulsar GCP)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: galaxy-configs
    namespace: galaxy
    kubeconfig: "{{ kubeconfig_path }}"
  register: pulsar_galaxy_configs
  when: enable_pulsar_gcp_batch | default(false) | bool

- name: Update job_conf.yml with amqp_url and galaxy_url for Pulsar GCP runner
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: galaxy-configs
        namespace: galaxy
      data: "{{ pulsar_galaxy_configs.resources[0].data | combine({'job_conf.yml': (pulsar_galaxy_configs.resources[0].data['job_conf.yml'] | from_yaml | combine({'runners': {'pulsar_gcp': {'amqp_url': pulsar_amqp_url, 'galaxy_url': pulsar_galaxy_url}}}, recursive=True) | to_nice_yaml) }) }}"
  when:
    - enable_pulsar_gcp_batch | default(false) | bool
    - pulsar_amqp_url is defined

- name: Restart Galaxy deployments for Pulsar GCP configuration
  shell: kubectl rollout restart deployment {{ item }} -n galaxy
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  loop:
    - galaxy-web
    - galaxy-workflow
    - galaxy-job-0
  when:
    - enable_pulsar_gcp_batch | default(false) | bool
    - pulsar_amqp_url is defined

# ============================================================================
# Persistent Data Reuse: RabbitMQ Credential Synchronization
# ============================================================================
# When reusing persistent disks, RabbitMQ may have different credentials than
# what the new Kubernetes secret generated. This syncs the credentials.
- name: Wait for RabbitMQ to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    name: galaxy-rabbitmq-server-server-0
    namespace: galaxy
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 300
  when: enable_persistent_data_reuse | default(true) | bool

- name: Get expected RabbitMQ credentials from secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: galaxy-rabbitmq-server-default-user
    namespace: galaxy
    kubeconfig: "{{ kubeconfig_path }}"
  register: rabbitmq_secret
  when: enable_persistent_data_reuse | default(true) | bool

- name: Decode expected RabbitMQ username
  set_fact:
    expected_rabbitmq_user: "{{ rabbitmq_secret.resources[0].data.username | b64decode }}"
    expected_rabbitmq_pass: "{{ rabbitmq_secret.resources[0].data.password | b64decode }}"
  when:
    - enable_persistent_data_reuse | default(true) | bool
    - rabbitmq_secret.resources | length > 0

- name: Check existing RabbitMQ users
  shell: |
    kubectl exec -n galaxy galaxy-rabbitmq-server-server-0 -c rabbitmq -- rabbitmqctl list_users --formatter json
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: rabbitmq_users_json
  ignore_errors: true
  when:
    - enable_persistent_data_reuse | default(true) | bool
    - expected_rabbitmq_user is defined

- name: Parse RabbitMQ users
  set_fact:
    rabbitmq_existing_users: "{{ rabbitmq_users_json.stdout | from_json | map(attribute='user') | list }}"
  when:
    - enable_persistent_data_reuse | default(true) | bool
    - rabbitmq_users_json.stdout is defined
    - rabbitmq_users_json.stdout != ""
    - rabbitmq_users_json.rc == 0

- name: Check if expected user exists in RabbitMQ
  set_fact:
    rabbitmq_user_exists: "{{ expected_rabbitmq_user in rabbitmq_existing_users }}"
  when:
    - enable_persistent_data_reuse | default(true) | bool
    - rabbitmq_existing_users is defined
    - expected_rabbitmq_user is defined

- name: Display RabbitMQ credential status
  debug:
    msg: "RabbitMQ expected user '{{ expected_rabbitmq_user }}' exists: {{ rabbitmq_user_exists | default(false) }}"
  when:
    - enable_persistent_data_reuse | default(true) | bool
    - expected_rabbitmq_user is defined

- name: Create expected RabbitMQ user (credential sync)
  shell: |
    kubectl exec -n galaxy galaxy-rabbitmq-server-server-0 -c rabbitmq -- \
      rabbitmqctl add_user '{{ expected_rabbitmq_user }}' '{{ expected_rabbitmq_pass }}'
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  when:
    - enable_persistent_data_reuse | default(true) | bool
    - rabbitmq_user_exists is defined
    - not rabbitmq_user_exists

- name: Set administrator tag for new RabbitMQ user
  shell: |
    kubectl exec -n galaxy galaxy-rabbitmq-server-server-0 -c rabbitmq -- \
      rabbitmqctl set_user_tags '{{ expected_rabbitmq_user }}' administrator
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  when:
    - enable_persistent_data_reuse | default(true) | bool
    - rabbitmq_user_exists is defined
    - not rabbitmq_user_exists

- name: Set permissions for new RabbitMQ user
  shell: |
    kubectl exec -n galaxy galaxy-rabbitmq-server-server-0 -c rabbitmq -- \
      rabbitmqctl set_permissions -p / '{{ expected_rabbitmq_user }}' '.*' '.*' '.*'
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  when:
    - enable_persistent_data_reuse | default(true) | bool
    - rabbitmq_user_exists is defined
    - not rabbitmq_user_exists

- name: Display RabbitMQ credential sync completed
  debug:
    msg: "Created RabbitMQ user '{{ expected_rabbitmq_user }}' with administrator permissions"
  when:
    - enable_persistent_data_reuse | default(true) | bool
    - rabbitmq_user_exists is defined
    - not rabbitmq_user_exists
