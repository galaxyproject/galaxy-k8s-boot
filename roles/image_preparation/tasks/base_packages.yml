---
- name: Wait for background apt/dpkg locks to be released
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      if ! fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; then
        exit 0
      fi
      sleep 5
    done
    exit 1
  changed_when: false
  failed_when: false
  become: true

- name: Update package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base system packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    install_recommends: false
  become: true

- name: Install Python packages via apt
  ansible.builtin.apt:
    name:
      - python3-kubernetes
      - python3-yaml
      - python3-jsonpatch
    state: present
  become: true

- name: Install python3-openshift via apt (Ubuntu only)
  ansible.builtin.apt:
    name: python3-openshift
    state: present
  become: true
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
  when: install_docker | default(false) | bool
  become: true

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg
    dest: /usr/share/keyrings/docker.asc
    mode: '0644'
  when: install_docker | default(false) | bool
  become: true

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: /usr/share/keyrings/docker.asc
    state: present
  when: install_docker | default(false) | bool
  become: true
  register: _docker_repo

- name: Update apt cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: true
  when:
    - install_docker | default(false) | bool
    - _docker_repo is changed
  become: true

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: install_docker | default(false) | bool
  become: true

- name: Enable Docker service for future boots (stopped for image capture)
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: stopped
  when: install_docker | default(false) | bool
  become: true
